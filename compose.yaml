services:
  db:
    image: postgres:18-trixie
    container_name: spotidata-pg
    mem_limit: 640m
    restart: unless-stopped
    environment:
      POSTGRES_USER: spotidata
      POSTGRES_PASSWORD: spotidata
      POSTGRES_DB: spotidata
      # Deterministic collation so ORDER BY does not drift between hosts.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      # PG18 images store data in a major-version subdirectory, so the mount
      # goes at /var/lib/postgresql (not /data as in <=17) to keep pg_upgrade
      # --link working across a future major bump.
      - pgdata:/var/lib/postgresql
    command:
      - postgres
      # Single-user local workload. Sized for a 12 GB host with no swap and ~50 other
      # containers: effective_cache_size must reflect cache this box can actually spare,
      # or the planner favours index scans over data that is not really resident.
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=32MB
      - -c
      - max_connections=60
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotidata -d spotidata"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
