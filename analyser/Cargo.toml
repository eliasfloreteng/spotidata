[package]
name = "rbx-analyse"
version = "0.1.0"
edition = "2021"
# rbxport's crates are GPL-2.0-or-later, and this binary links them.
license = "GPL-2.0-or-later"
publish = false
description = "Tempo and key of audio files, measured by rbxport, as JSON lines."

[dependencies]
# rbxport's analysis, at the same fork and rev Deckhand pins, so a track
# measured here reads the same as it does on the stick.
rbl-analysis = { git = "https://github.com/eliasfloreteng/rbxport", rev = "ebc7ef22698272ce1d0c7582b6dadba878189300" }
rbl-audio = { git = "https://github.com/eliasfloreteng/rbxport", rev = "ebc7ef22698272ce1d0c7582b6dadba878189300" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
